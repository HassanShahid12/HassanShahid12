name: Refresh GitHub Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate profile analytics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: HassanShahid12
          cards: overview,contributions,lifetime,composition,rhythm,cadence,repositories,portfolio,languages
          output-dir: assets
          themes: light,dark
          commit: true
